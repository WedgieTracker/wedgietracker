name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test & Build
    if: contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: true
      # Dummy env vars so service clients don't crash during build
      TURSO_DATABASE_URL: "file:ci.db"
      TURSO_AUTH_TOKEN: "ci"
      NEXTAUTH_URL: "http://localhost:3000"
      AUTH_SECRET: "ci"
      GOOGLE_CLIENT_ID: "ci"
      GOOGLE_CLIENT_SECRET: "ci"
      CLOUDINARY_CLOUD_NAME: "ci"
      CLOUDINARY_API_KEY: "ci"
      CLOUDINARY_API_SECRET: "ci"
      INSTAGRAM_CLIENT_ID: "ci"
      INSTAGRAM_CLIENT_SECRET: "ci"
      INSTAGRAM_BUSINESS_ACCOUNT_ID: "ci"
      INSTAGRAM_ACCESS_TOKEN: "ci"
      MAILCHIMP_API_KEY: "ci"
      MAILCHIMP_SERVER_PREFIX: "ci"
      MAILCHIMP_LIST_ID: "ci"
      STRIPE_SECRET_KEY: "sk_test_ci"
      STRIPE_WEBHOOK_SECRET: "whsec_ci"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci"
      WEDGIETRACKER_API_KEY: "ci"
      PRINTFUL_API_KEY: "ci"
      PRINTFUL_STORE_ID: "ci"
      RESEND_API_KEY: "re_ci"
      TELEGRAM_BOT_TOKEN: "ci"
      TELEGRAM_CHAT_ID: "ci"
      NEXT_PUBLIC_GA_ID: "G-CI"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
