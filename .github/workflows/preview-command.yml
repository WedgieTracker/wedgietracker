name: Preview Deploy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/preview') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Get PR branch
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('number', context.issue.number);

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0

      - name: Push to private repo preview branch
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Set up SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          # Configure git
          git config --global user.name "gek0z"
          git config --global user.email "riccardoaltieri@me.com"

          # Create a clean branch without excluded files
          git checkout -b preview-pr-${{ steps.pr.outputs.number }}
          if [ -f .github/sync-exclude.txt ]; then
            while IFS= read -r pattern; do
              git rm -r --cached "$pattern" || true
            done < .github/sync-exclude.txt
          fi
          git commit -m "Preview for PR #${{ steps.pr.outputs.number }}" || true

          # Push to private repo
          git remote add private git@github.com:gek0z/wedgietracker.git
          git push private preview-pr-${{ steps.pr.outputs.number }} --force

      - name: Comment on PR
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Preview branch pushed as \`preview-pr-${context.issue.number}\`. Deploy should start shortly.`
            });
