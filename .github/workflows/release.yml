name: Release

on:
  push:
    branches:
      - main
  # A minor or major release, or an exact version (1.1.0 at the joint web and
  # app launch), is chosen here on purpose. Merges only ever bump the patch,
  # so the web keeps its major.minor in step with the iOS app.
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part to bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Or an exact version, e.g. 1.1.0 (overrides bump)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get latest version
        id: latest
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT

      - name: Determine version bump
        id: version
        run: |
          LATEST_TAG=${{ steps.latest.outputs.latest_tag }}
          LATEST_VERSION=${LATEST_TAG}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"

          # Merges bump the patch. Minor and major come only from a manual
          # run, never from commit messages.
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          EXACT="${{ github.event.inputs.version }}"

          # Calculate new version
          case $BUMP in
            "major")
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            "minor")
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              ;;
            "patch")
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              ;;
          esac

          if [ -n "$EXACT" ]; then
            if ! [[ "$EXACT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must look like 1.1.0, got $EXACT"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$EXACT" >/dev/null; then
              echo "::error::tag $EXACT already exists"
              exit 1
            fi
            NEW_VERSION="$EXACT"
          fi

          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version will be: ${NEW_VERSION}"

      - name: Create Git tag
        run: |
          git tag ${{ steps.version.outputs.new_version }}
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Generate Release Notes
        id: release_notes
        run: |
          # Check if we have a real tag or the default 0.0.0
          if [ "${{ steps.latest.outputs.latest_tag }}" = "0.0.0" ]; then
            # If this is the first release, get all commits
            COMMITS=$(git log --pretty=format:"- %s")
          else
            # Otherwise get commits since last tag
            COMMITS=$(git log ${{ steps.latest.outputs.latest_tag }}..HEAD --pretty=format:"- %s")
          fi
          echo "COMMITS<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          release_name: ${{ steps.version.outputs.new_version }}
          body: |
            ## What's Changed
            ${{ steps.release_notes.outputs.COMMITS }}
          draft: false
          prerelease: false
