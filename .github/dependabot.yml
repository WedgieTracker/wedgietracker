version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "main"
    open-pull-requests-limit: 10
    reviewers:
      - "gek0z"
    assignees:
      - "gek0z"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      major:
        update-types:
          - "major"
    # Expo pins the app's native packages to its SDK: upgrade them together with
    # `npx expo install --fix`. TypeScript stays on 6 in the app because Expo expects it.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@sentry/react-native"
      # The app needs the exact React its React Native renderer was built with, which
      # expo install --fix sets. Next ships its own React, so the site loses nothing.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "gek0z"
    assignees:
      - "gek0z"
    groups:
      all-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
